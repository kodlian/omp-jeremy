<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission Control</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f7bf6'/%3E%3Cg transform='translate(5 5) scale(.9167)' fill='none' stroke='%23fff' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5'/%3E%3Cpath d='M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09'/%3E%3Cpath d='M9 12a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.4 22.4 0 0 1-4 2z'/%3E%3Cpath d='M9 12H4s.55-3.03 2-4c1.62-1.08 5 .05 5 .05'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="/design-system.css">
<style>
:root{--header-h:40px;--panel-w:460px}
body{display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
@keyframes pulse{50%{opacity:.3}}
@keyframes pop{from{opacity:0;transform:translateY(4px) scale(.98)}}
@keyframes fade{from{opacity:0}}
@keyframes flash{from{background:color-mix(in srgb,var(--add) 24%,transparent)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* MARK: controls */
.chip{display:inline-flex;align-items:center;gap:4px;min-width:0;height:18px;padding:0 6px;border-radius:var(--radius-sm);background:var(--surface-2);color:var(--muted);font-size:var(--font-size-xs);font-weight:500;white-space:nowrap}
button.chip{flex:none;border:0}
button.chip:hover:not(:disabled){color:var(--fg)}
.chip.needs{background:color-mix(in srgb,var(--warning) 15%,transparent);color:var(--warning)}
button.chip:disabled{cursor:default;opacity:.7}
.chip .x{display:inline-flex;margin-right:-2px;color:var(--faint)}
.chip .x:hover{color:var(--remove)}
.dot{flex:none;width:7px;height:7px;border-radius:50%;background:currentColor}
.dot.pulse{animation:pulse 1.4s ease-in-out infinite}
.flash{animation:flash 1s ease-out}
.shake{animation:shake .3s}

/* MARK: toolbar */
.toolbar{display:flex;flex:none;align-items:center;gap:8px;height:var(--header-h);padding:0 10px 0 14px}
.brand{display:inline-flex;align-items:center;gap:7px;font-size:var(--font-size);font-weight:650}
.brand .icon{color:var(--accent)}
.ctx{display:inline-flex;align-items:center;gap:5px;min-width:0;margin-left:4px;padding-left:12px;color:var(--muted);white-space:nowrap}
.ctx strong{color:var(--fg);font-weight:600}
.ctx .mono{overflow:hidden;font-size:var(--font-size-sm);text-overflow:ellipsis}
button.ctx{border:0;background:none;padding:0 0 0 12px}
button.ctx:hover{color:var(--fg)}
.conn{flex:none;width:7px;height:7px;margin-left:2px;border-radius:50%;background:var(--remove)}
.conn.on{background:var(--add)}
.search{display:flex;align-items:center;gap:6px;width:220px;height:var(--control-h);padding:0 5px 0 8px;border:1px solid transparent;border-radius:var(--radius);background:var(--surface);color:var(--faint)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search input{flex:1;min-width:0;height:100%;padding:0;border:0;background:transparent;color:var(--fg)}
.search:focus-within kbd{display:none}
.tagbar{display:flex;flex:none;flex-wrap:wrap;align-items:center;gap:6px;padding:0 14px 4px;color:var(--faint)}
.tagbar[hidden]{display:none}
.tag{display:inline-flex;flex:none;align-items:center;gap:3px;height:18px;padding:0 7px;border:0;border-radius:9px;background:var(--accent-soft);color:var(--accent);font-size:var(--font-size-xs);font-weight:500;white-space:nowrap}
.tag .x{display:inline-flex;margin-right:-3px;color:var(--faint);cursor:pointer}
.tag .x:hover{color:var(--remove)}
.tagbar button.tag{height:22px;padding:0 9px;background:var(--surface);color:var(--muted)}
.tagbar button.tag:hover{color:var(--fg)}
.tagbar button.tag.on{background:var(--accent);color:var(--accent-fg)}
.c-tags{display:flex;flex-wrap:wrap;align-items:center;gap:4px;min-width:0}
.c-tags>.chip{max-width:100%;overflow:hidden}
.tags-edit{display:flex;flex-wrap:wrap;align-items:center;gap:4px;min-height:var(--control-h)}

/* MARK: board */
.main{position:relative;display:flex;flex:1;min-height:0}
.board{display:flex;flex:1;gap:10px;min-width:0;padding:12px;overflow-x:auto;overflow-y:hidden}
.col{display:flex;flex:1 0 208px;flex-direction:column;min-width:0;max-width:400px;min-height:0;border-radius:var(--radius-lg);background:var(--surface);transition:box-shadow .12s}
.col.over{box-shadow:inset 0 0 0 1px var(--accent)}
.col-h{display:flex;flex:none;align-items:center;gap:7px;height:38px;padding:0 6px 0 12px}
.col-t{font-weight:600}
.col-h .count{color:var(--faint);font-weight:500;font-variant-numeric:tabular-nums}
.col-b{display:flex;flex:1;flex-direction:column;gap:8px;min-height:60px;padding:0 8px 12px;overflow-y:auto}
.col-empty{padding:18px 10px;border-radius:8px;color:var(--faint);font-size:var(--font-size-sm);text-align:center}
.col-b:has(.ph) .col-empty{display:none}
.card.untracked{border:1px dashed var(--line-strong);background:transparent}
.card.untracked .c-title{font-family:var(--mono);font-size:var(--font-size-sm)}
.card.is-hidden{opacity:.55}
.card{position:relative;display:flex;flex:none;flex-direction:column;gap:6px;min-width:0;padding:9px 11px 10px;border:1px solid transparent;border-radius:8px;background:var(--raised);cursor:pointer;transition:border-color .12s,box-shadow .12s}
.card:hover{background:var(--hover)}
.card.sel{border-color:var(--accent);background:var(--accent-soft)}
.card:focus-visible,.pipeline-node:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card.dep-highlight,.pipeline-node.dep-highlight{background:var(--accent-soft)}
.card.path-ready:not(.dep-highlight):not(.sel),.pipeline-node.path-ready:not(.dep-highlight):not(.sel){background:color-mix(in srgb,var(--add) 12%,var(--raised))}
.card.path-blocked:not(.dep-highlight):not(.sel),.pipeline-node.path-blocked:not(.dep-highlight):not(.sel){background:color-mix(in srgb,var(--remove) 10%,var(--raised))}
.card.path-unrelated:not(.dep-highlight):not(:hover),.pipeline-node.path-unrelated:not(.dep-highlight):not(:hover){opacity:.4}
.card.dragging{opacity:.35}
.card.needs{background:color-mix(in srgb,var(--warning) 5%,var(--raised))}
.card.needs::before{content:"";position:absolute;top:9px;bottom:9px;left:-1px;width:3px;border-radius:0 3px 3px 0;background:var(--warning)}
.c-top{display:flex;align-items:center;gap:6px;min-width:0;color:var(--faint);font-size:var(--font-size-sm)}
.c-id{font-family:var(--mono);font-size:var(--font-size-xs)}
.c-title{display:-webkit-box;overflow:hidden;font-size:var(--font-size);font-weight:500;line-height:1.35;overflow-wrap:anywhere;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.c-line{display:flex;align-items:center;gap:6px;min-width:0;color:var(--muted);font-size:var(--font-size-sm)}
.c-line>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-line>.icon{color:var(--faint)}
.c-foot{display:flex;align-items:center;gap:8px;min-width:0;padding-top:3px;color:var(--muted);font-size:var(--font-size-sm)}
.ph{flex:none;height:44px;border:1.5px dashed var(--accent);border-radius:8px;background:var(--accent-soft)}
.state{display:inline-flex;align-items:center;gap:6px;font-size:var(--font-size-sm);font-weight:550;white-space:nowrap}
.state .t{color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.state.busy{color:var(--accent)}
.state.needs{color:var(--warning)}
.state.err{color:var(--remove)}
.state.idle{color:var(--muted)}
.state.idle .dot{color:var(--add)}
.state.faint{color:var(--faint)}
.state.ok{color:var(--add)}
.branch{display:inline-flex;align-items:center;gap:4px;min-width:0;font-family:var(--mono);font-size:var(--font-size-xs)}
.branch span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.diffstat{font-family:var(--mono);font-size:var(--font-size-xs);font-variant-numeric:tabular-nums;white-space:nowrap}
.diffstat .a{color:var(--add)}
.diffstat .r{color:var(--remove)}
.udot{flex:none;width:6px;height:6px;border-radius:50%;background:var(--warning)}
.pr-chip{display:inline-flex;flex:none;align-items:center;gap:3px;height:18px;padding:0 5px;border-radius:var(--radius-sm);background:color-mix(in srgb,currentColor 14%,transparent);font-size:var(--font-size-xs);font-weight:600;text-decoration:none!important}
.pr-checks{flex:none;width:6px;height:6px;margin-left:1px;border-radius:50%}
.pr-checks.passing{background:var(--add)}
.pr-checks.failing{background:var(--remove)}
.pr-checks.pending{display:inline-flex;width:auto;height:auto;background:none;color:var(--faint)}
.pr-chip .approved{color:var(--add)}
.pr-chip .changes,.pr-chip .conflict{color:var(--remove)}

/* MARK: panel */
.resizer{flex:none;width:7px;margin:0 -3px 0 -4px;z-index:5;cursor:col-resize}
.resizer:hover,.resizer.dragging{background:var(--accent-soft)}
.panel{display:flex;flex:none;flex-direction:column;width:var(--panel-w);min-width:380px;max-width:72vw;min-height:0;background:var(--surface)}
.p-head{display:flex;flex:none;align-items:center;gap:6px;height:var(--header-h);padding:0 8px 0 14px}
.p-id{margin-right:2px;color:var(--muted);font-family:var(--mono);font-size:var(--font-size-sm)}
.p-primary{display:contents}
.status-btn{display:inline-flex;align-items:center;gap:6px;height:var(--tool-size);padding:0 8px;border:1px solid transparent;border-radius:var(--radius);background:var(--surface);font-weight:500}
.status-btn:hover{background:var(--hover)}
.status-btn .chev{color:var(--faint)}
.p-title-wrap{flex:none;padding:14px 16px 10px}
.p-title{display:block;width:calc(100% + 12px);margin:0 -6px;padding:3px 6px;overflow:hidden;border:0;border-radius:var(--radius);background:transparent;font-size:calc(var(--font-size-lg) * 1.2);font-weight:650;line-height:1.3;resize:none}
.p-title:hover{background:var(--hover)}
.p-title:focus{background:var(--surface-2)}
.p-tabs{flex:none;padding:0 16px 10px}
.p-tabs .dot{width:6px;height:6px}
.p-scroll{flex:1;min-height:0;overflow-y:auto}
.pane{display:flex;flex-direction:column;gap:18px;padding:16px}
.loop-view{min-width:0}
.sec{display:flex;flex-direction:column;gap:8px}
.sec-h{display:flex;align-items:center;gap:6px;height:24px;color:var(--muted);font-size:var(--font-size-sm);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.sec-h .meta{color:var(--faint);font-weight:400;letter-spacing:0;text-transform:none}
.props{display:grid;grid-template-columns:104px minmax(0,1fr);row-gap:2px;align-items:center}
.props label{display:flex;align-items:center;gap:7px;height:var(--control-h);color:var(--muted)}
.props label .icon{color:var(--faint)}
.prop{width:calc(100% + 7px);height:var(--control-h);margin-left:-7px;padding:0 7px;border:0;border-radius:5px;background:transparent;text-overflow:ellipsis}
.prop.mono{font-size:var(--font-size-sm)}
.prop.mono::placeholder{font-family:var(--ui);font-size:var(--ui-font-size)}
.prop:hover:not(:disabled){background:var(--hover)}
.prop:focus{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--accent)}
.prop:disabled{color:var(--muted);cursor:default}
.p-prompt{margin:0;color:var(--fg);font-size:var(--font-size);line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.p-prompt.none{color:var(--faint)}
.prop-row{display:flex;gap:6px;align-items:center;min-width:0}
.prop-row>.prop{flex:1;min-width:0}
.deps{display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-height:var(--control-h)}

/* MARK: content */
.md{font-size:var(--font-size);line-height:1.6;overflow-wrap:anywhere}
.md>:first-child{margin-top:0}
.md>:last-child{margin-bottom:0}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{margin:18px 0 6px;font-size:1em;font-weight:650;line-height:1.3}
.md h1{font-size:calc(var(--font-size-lg) * 1.15)}
.md h2{margin-top:20px;font-size:var(--font-size-lg)}
.md h3{font-size:var(--font-size-lg)}
.md p{margin:6px 0}
.md ul,.md ol{margin:6px 0;padding-left:20px}
.md li{margin:3px 0}
.md li::marker{color:var(--faint)}
.md li.task{margin-left:-18px;list-style:none}
.md li.task input{margin:0 6px 0 0;vertical-align:-1px}
.md code{padding:1px 4px;border-radius:var(--radius-sm);background:var(--surface-2);font-family:var(--mono);font-size:var(--code-font-size-sm);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.md pre{margin:8px 0;padding:10px 12px;overflow-x:auto;border:1px solid var(--line);border-radius:7px;background:var(--surface);line-height:1.45}
.md pre code{padding:0;background:none}
.md blockquote{margin:8px 0;padding:2px 0 2px 12px;border-left:3px solid var(--line-strong);color:var(--muted)}
.md table{margin:8px 0;border-collapse:collapse;font-size:var(--ui-font-size)}
.md th,.md td{padding:4px 9px;border:1px solid var(--line)}
.md th{background:var(--surface);font-weight:600}
.md hr{margin:14px 0;border:0;border-top:1px solid var(--line)}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:16px;border-radius:var(--radius-lg);color:var(--muted);line-height:1.5}
.empty strong{display:flex;align-items:center;gap:7px;color:var(--fg);font-size:var(--font-size)}
.empty strong .icon{color:var(--accent)}
.activity{overflow:hidden;border-radius:var(--radius-lg);background:var(--surface)}
.activity.failed{background:color-mix(in srgb,var(--remove) 6%,var(--bg))}
.act-h{display:flex;align-items:center;gap:8px;min-height:38px;padding:0 8px 0 12px}
.act-h .ic{color:var(--accent)}
.activity.failed .act-h .ic{color:var(--remove)}
.act-h .lbl{font-weight:600}
.act-err{padding:0 12px 10px;color:var(--remove);white-space:pre-wrap;overflow-wrap:anywhere}
.log{max-height:220px;margin:0;padding:8px 12px;overflow:auto;color:var(--muted);font:var(--code-font-size-sm)/1.45 var(--mono);white-space:pre-wrap}

/* MARK: agent */
.agent-head{display:flex;align-items:center;gap:8px;min-height:var(--tool-size)}
.agent-msg{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:8px;background:var(--surface);color:var(--muted);font-size:var(--font-size-sm);line-height:1.45}
.agent-msg .icon{margin-top:2px;color:var(--faint)}
.agent-msg span{display:-webkit-box;overflow:hidden;white-space:pre-wrap;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.agent-step{display:flex;align-items:center;gap:8px;min-width:0;color:var(--muted);font-size:var(--font-size-sm)}
.agent-step span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agent-step .icon{color:var(--faint)}
.git-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:var(--muted);font-size:var(--font-size-sm)}
.git-row .to{color:var(--faint)}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.term{height:clamp(240px,50vh,760px);margin:0;padding:10px 12px;overflow:auto;border-radius:var(--radius-lg);background:color-mix(in srgb,var(--fg) 3%,var(--bg));color:var(--fg);font:var(--code-font-size-sm)/1.35 var(--mono);white-space:pre}
.banner{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-lg);background:var(--surface)}
.banner>.icon{color:var(--merged)}
.banner .txt{flex:1;color:var(--muted)}
.banner .txt strong{color:var(--fg);font-weight:600}

/* MARK: composer */
.composer-wrap{flex:none;padding:6px 12px 12px}
.composer{display:flex;flex-direction:column;border:1px solid transparent;border-radius:12px;background:var(--bg);transition:border-color .12s,box-shadow .12s}
.composer:focus-within{border-color:color-mix(in srgb,var(--accent) 70%,var(--line-strong));box-shadow:0 0 0 3px var(--accent-soft)}
.composer textarea{display:block;width:100%;min-height:44px;max-height:220px;padding:11px 13px 4px;border:0;background:transparent;font-size:var(--font-size);line-height:1.5;resize:none}
.composer textarea:disabled{cursor:not-allowed}
.composer-bar{display:flex;align-items:center;gap:6px;padding:4px 6px 6px 7px}
.hint{color:var(--faint);font-size:var(--font-size-sm);white-space:nowrap}
.send{display:inline-flex;flex:none;align-items:center;justify-content:center;width:var(--control-h);height:var(--control-h);padding:0;border:0;border-radius:50%;background:var(--accent);color:var(--accent-fg)}
.send:hover{filter:brightness(1.08)}
.send:disabled{background:var(--surface-2);color:var(--faint);pointer-events:none}
.prop-chip select{max-width:200px;padding:0;border:0;background:transparent;color:var(--fg);font-family:var(--mono);font-size:var(--font-size-sm)}
.prop-chip select:disabled{color:var(--muted);opacity:1}

/* MARK: menu */
.menu{position:fixed;z-index:90;min-width:210px;max-width:340px;padding:4px;border-radius:9px;background:var(--raised);box-shadow:var(--shadow);animation:pop .1s ease-out}
.menu-h{padding:6px 9px 4px;color:var(--faint);font-size:var(--font-size-xs);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.menu button{display:flex;align-items:center;gap:9px;width:100%;height:var(--field-h);padding:0 9px;border:0;border-radius:var(--radius);background:transparent;text-align:left;white-space:nowrap}
.menu button .icon{color:var(--muted)}
.menu button .lbl{flex:1;overflow:hidden;text-overflow:ellipsis}
.menu button .sub{color:var(--faint);font-size:var(--font-size-sm)}
.menu button .chk{color:var(--accent)}
.menu button:hover,.menu button:focus-visible{outline:none;background:var(--accent);color:var(--accent-fg)}
.menu button:hover .icon,.menu button:hover .sub,.menu button:focus-visible .icon,.menu button:focus-visible .sub{color:inherit}
.menu button.danger,.menu button.danger .icon{color:var(--remove)}
.menu button.danger:hover,.menu button.danger:hover .icon{background:var(--remove);color:#fff}
.menu button:disabled{opacity:.4;pointer-events:none}
.menu hr{margin:4px 2px;border:0;border-top:1px solid var(--line)}
.menu-input{width:calc(100% - 8px);margin:4px}

/* MARK: modals */
.overlay{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px 16px;background:rgb(0 0 0 / .45);animation:fade .12s ease-out}
.overlay:has(.diff){padding-top:5vh}
.modal{display:flex;flex-direction:column;width:440px;max-width:100%;max-height:100%;overflow:hidden;border-radius:12px;background:var(--raised);box-shadow:var(--shadow);animation:pop .14s ease-out}
.m-body{display:flex;flex-direction:column;gap:10px;padding:18px 18px 16px}
.m-body h2{margin:0;font-size:var(--font-size-lg);font-weight:650}
.m-text{margin:0;color:var(--muted);line-height:1.5}
.m-label{margin-bottom:-4px;color:var(--muted);font-size:var(--font-size-sm);font-weight:500}
.m-note{display:flex;flex-wrap:wrap;align-items:center;gap:5px;color:var(--muted);font-size:var(--font-size-sm)}
.m-note .mono{color:var(--fg)}
.check{display:flex;gap:8px;align-items:center;color:var(--muted)}
.m-foot{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--surface)}
.modal.nt{width:620px}
.nt-head{display:flex;align-items:center;gap:6px;padding:14px 18px 0;color:var(--muted);font-size:var(--font-size-sm);font-weight:500}
.nt-head>.icon{color:var(--accent)}
.nt-desc{display:block;width:100%;min-height:110px;max-height:45vh;padding:4px 18px 12px;border:0;background:transparent;font-size:var(--font-size);line-height:1.55;resize:none}
.nt-props{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 14px}
.prop-chip{display:inline-flex;align-items:center;gap:6px;height:var(--tool-size);padding:0 9px;border:1px solid transparent;border-radius:7px;background:var(--surface);color:var(--muted)}
.prop-chip:focus-within{border-color:var(--accent)}
.nt-foot{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 14px;background:var(--surface)}
.toasts{position:fixed;bottom:18px;left:50%;z-index:100;display:flex;flex-direction:column;align-items:center;gap:6px;transform:translateX(-50%);pointer-events:none}
.toast{display:flex;align-items:center;gap:8px;max-width:520px;padding:8px 14px;border-radius:9px;background:var(--raised);box-shadow:var(--shadow);animation:pop .14s ease-out;pointer-events:auto}
.toast .icon{color:var(--add)}
.toast.error .icon{color:var(--remove)}
@media (max-width:900px){

function ago(iso) {
  if (!iso) return "";
  const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
  if (s < 45) return "just now";
  if (s < 3600) return `${Math.round(s / 60)}m ago`;
  if (s < 86400) return `${Math.round(s / 3600)}h ago`;

}

  if (!iso) return "";

// MARK: api
async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (method !== "GET") { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body ?? {}); }
  const res = await fetch(path, opts);
  let data = null;
  try { data = await res.json(); } catch {}
  if (!res.ok) { const e = new Error((data && data.error) || `${res.status} ${res.statusText}`); e.data = data; e.status = res.status; throw e; }
  return data;
}

  catch (e) { toast(e.message, true); throw e; }
}

  const cleanup = h("div", { class: "banner" }, I("prMerged", 16), cleanupText,
    h("button", { class: "btn sm danger", onclick: () => confirmCleanup(findTask(openId)) }, "Remove worktree"));
  const health = h("div", { class: "banner" }, I("alert", 16),
    h("div", { class: "txt" }, h("strong", {}, "Worktree missing"), " The recorded worktree was deleted outside the board, so the task can't continue. Removing the card leaves its branch and commits untouched."),
    h("button", { class: "btn sm", onclick: () => confirmRecover(findTask(openId)) }, "Remove card"));
  const opFailText = h("div", { class: "txt" });
  const opFail = h("div", { class: "banner" }, I("alert", 16), opFailText);
  const term = h("pre", { class: "term" });
  term.addEventListener("scroll", () => { if (P) P.termPinned = term.scrollHeight - term.scrollTop - term.clientHeight < 8; });
  const closed = h("div", { class: "empty" }, h("strong", {}, I("terminal", 14), "Session disconnected"),
    h("span", {}, "The board cannot confirm the agent's current state. A missing terminal attachment does not mean the agent stopped."),
    h("button", { class: "btn sm", onclick: openWorkspace }, I("openIn", 12), "Connect terminal"));
  const removed = h("div", { class: "empty" }, h("strong", {}, I("check", 14), "Worktree removed"), h("span", {}, "The task's worktree and branch were cleaned up."));
  const live = h("div", { class: "sec" }, health, opFail, agentHead, agentStep, agentMsg, gitRow, actions, cleanup, term, closed);
  const agentPane = h("div", { class: "pane" }, spawn.el, live, removed);

  // loop pane
  const loopOpen = h("button", { class: "btn sm", title: "Open the task session's Control page", onclick: () => act("POST", tpath(openId, "/control/open"), {}).catch(() => {}) }, I("openIn", 13), "Open in Control");
  const loopView = h("div", { class: "loop-view" });
  const loopPane = h("div", { class: "pane" }, h("div", { class: "actions" }, loopOpen), loopView);

  // composer
  const ta = h("textarea", { rows: "1" });
  const hint = h("span", { class: "hint" });
  const send = h("button", { class: "send", title: "Send to the agent (\u2318\u21A9)", onclick: submitComposer }, I("arrowUp", 15));
  const composer = h("div", { class: "composer-wrap" },
    h("div", { class: "composer" }, ta, h("div", { class: "composer-bar" }, h("span", { class: "spacer" }), hint, send)));
  ta.addEventListener("input", () => { if (P.cmode) drafts.set(`${openId}:${P.cmode}`, ta.value); autosize(ta, 220); syncSend(); });
  ta.addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); submitComposer(); } });

  $("#panel").replaceChildren(head, h("div", { class: "p-title-wrap" }, title),
    h("div", { class: "p-tabs" }, h("div", { class: "segmented" }, tabTask, tabAgent, tabLoop)),
    h("div", { class: "p-scroll" }, taskPane, agentPane, loopPane), composer);
  P = { id, status, primary, openBtn, title, tabTask, tabAgent, agentDot, tabLoop, loopDot, ticket, branch, base, loop, loopLabel, repo, tags, deps, depsAdd, prompt,
        taskPane, spawn, agentHead, agentStep, agentMsg, gitRow, actions, cleanup, cleanupText, health, opFail, opFailText, term, closed, removed, live, agentPane,
        loopPane, loopView, loopOpen, loopKey: null,
        composer, ta, hint, send, cmode: null, termPinned: true, sending: false };
  P.links = linksPanel(props, taskPane);
}

function moreMenu(t) {
  const items = [{ icon: "copy", label: "Copy branch name", action: () => copyText(t.branch, "Branch name copied") }];
  if (t.branch) items.push(hideItem(t.project, t.branch));
  if (t.health?.worktreeMissing) {
    items.push("-", { icon: "trash", label: "Remove card…", action: () => confirmRecover(t) });
  } else if (t.worktree) {
    items.push("-", { icon: "openIn", label: "Open worktree", action: () => openWorktree() });
    if (t.presentation?.capabilities?.diff) items.push({ icon: "compare", label: "Open terminal diff", action: () => act("POST", tpath(t.id, "/diff/open"), {}).catch(() => {}) });
    if (t.land?.pr && t.column !== "done") items.push({ icon: "pr", label: "Create pull request", action: () => createPr(t) });
    if (t.column !== "done" && !t.merged && t.agent?.state !== "stopped") items.push({ icon: "stop", label: "Stop agent…", action: () => confirmStop(t) });
    if (t.column !== "done") items.push({ icon: "trash", label: "Remove worktree…", danger: true, action: () => confirmCleanup(t) });
  }
  items.push("-", { icon: "plus", label: "Create child task…", disabled: t.column === "done" || !!t.merged, action: () => openComposer({ parent: t.id }) });
  items.push("-", { icon: "trash", label: "Delete task…", danger: true, action: () => confirmDelete(t) });
  return items;
}
function dependencyMenu(t) {
  const tree = new Set([...linksAncestors(t.id), ...linksDescendants(t.id)]);
  const items = board.tasks.filter(x => x.id !== t.id && x.project === t.project && !tree.has(x.id) && !t.dependsOn.includes(x.id) && x.column !== "done")
    .map(x => ({ label: `${taskNumber(x.id)} ${x.title}`, action: () => act("PATCH", tpath(t.id), { dependsOn: [...t.dependsOn, x.id] }).catch(() => {}) }));
  return items.length ? items : [{ header: "No other open task" }];
}
function highlightDependencyPath() {
  const tasks = new Map(board.tasks.map(t => [t.id, t]));
  const upstream = new Set(), connections = new Set(), pending = openId ? [openId] : [];
  while (pending.length) {
    const id = pending.pop();
    if (upstream.has(id)) continue;
    upstream.add(id);
    for (const prerequisite of tasks.get(id)?.dependsOn || []) {
      connections.add(prerequisite + ":" + id);
      pending.push(prerequisite);
    }
  }
  document.querySelectorAll("#board .card,#board .pipeline-node,#board .workbench-tile").forEach(node => {
    const id = node.dataset.id, prerequisite = id !== openId && upstream.has(id);
    const ready = tasks.get(id)?.column === "done";
    node.classList.toggle("path-ready", prerequisite && ready);
    node.classList.toggle("path-blocked", prerequisite && !ready);
    node.classList.toggle("path-unrelated", !!openId && !upstream.has(id));
  });
  if (boardView === "pipeline" && pipeline.root) {
    for (const edge of pipeline.edges.values()) {
      const related = connections.has(edge.key), ready = tasks.get(edge.from)?.column === "done";
      edge.group.classList.toggle("path-ready", related && ready);
      edge.group.classList.toggle("path-blocked", related && !ready);
      edge.group.classList.toggle("path-unrelated", !!openId && !related);
    }
  }
}
function highlightDependency(id, reveal = false) {
  highlightedDependency = id;
  let target = null;
  document.querySelectorAll("#board .card,#board .pipeline-node,#board .workbench-tile").forEach(node => {
    const highlighted = node.dataset.id === id;
    node.classList.toggle("dep-highlight", highlighted);
    if (highlighted) target = node;
  });
  if (reveal && target && boardView !== "pipeline") target.scrollIntoView({ block: "nearest", inline: "nearest" });
}
function dependencyHighlightChanged(e) {
  const entering = e.type === "mouseenter" || e.type === "focus";
  const fallback = P?.deps.querySelector(e.type === "mouseleave" ? "[data-dependency]:focus" : "[data-dependency]:hover");
  highlightDependency(entering ? e.currentTarget.dataset.dependency : fallback?.dataset.dependency || null, entering);
}
function dependencyChip(t, id) {
  const dep = findTask(id);
  const remove = h("span", { class: "x", title: "Remove the dependency", onclick: e => { e.stopPropagation(); act("PATCH", tpath(t.id), { dependsOn: t.dependsOn.filter(d => d !== id) }).catch(() => {}); } }, I("x", 10));
  return h("button", { class: "chip mono", "data-dependency": id, title: dep ? dep.title : "deleted",
    onmouseenter: dependencyHighlightChanged, onmouseleave: dependencyHighlightChanged,
    onfocus: dependencyHighlightChanged, onblur: dependencyHighlightChanged, onclick: () => openPanel(id) }, taskNumber(id), remove);
}

function updatePanel() {
  const t = findTask(openId);
  if (!t || !P) return;
  P.id.textContent = taskNumber(t.id);
  P.status.replaceChildren(frag(colIcon(t.column)), h("span", {}, colTitle(t.column)), I("chevronDown", 12, "chev"));
  const missing = !!t.health?.worktreeMissing;
  const btn = (label, icon, onclick, title) => actionButton(label, icon, onclick, true, title);
  P.primary.replaceChildren(...(missing ? [btn("Remove card", "trash", () => confirmRecover(t), "The worktree was deleted outside the board; remove the card")]
    : t.spawn.state === "failed" ? [btn("Retry start", "play", () => doMove(t, "doing"), "Create the worktree and start omp on this task again")]
    : t.paused || (t.column === "doing" && t.agent?.state === "stopped") ? [btn("Resume", "play", () => requestMove(t.id, "doing"),
      t.blockedBy.length ? `It waits for ${taskNumbers(t.blockedBy)}; resuming now asks first` : "Moves it to In Progress; its agent continues where it stopped")]
    : t.agent?.state === "plan_ready" ? [btn("Review plan", "file", openWorkspace, "Opens the agent's terminal, where its plan waits for review")]
    : landActions(t)));
  P.openBtn.hidden = !t.worktree || missing;
  if (setField(P.title, t.title) || !P.title.style.height) autosize(P.title, 120);
  setField(P.ticket, t.ticket);
  setField(P.branch, t.branch);
  setField(P.base, t.base);
  P.loop.hidden = P.loopLabel.hidden = !t.loop;
  setField(P.loop, t.loop ? loopName(t) : "");
  setField(P.repo, t.repo);
  if (JSON.stringify(P.tags.tags) !== JSON.stringify(t.tags || [])) P.tags.show(t.tags || []);
  const depsKey = JSON.stringify(t.dependsOn);
  if (P.deps.dataset.key !== depsKey) {
    highlightDependency(null);
    P.deps.dataset.key = depsKey;
    P.deps.replaceChildren(...t.dependsOn.map(id => dependencyChip(t, id)), P.depsAdd);
  }
  P.deps.querySelectorAll("[data-dependency]").forEach(chip => {
    chip.title = findTask(chip.dataset.dependency)?.title || "deleted";
  });
  linksPanelUpdate(t);
  P.title.disabled = t.column === "done" || !!t.merged;
  P.prompt.textContent = t.description || "No prompt: this card tracks a worktree made outside the board.";
  P.prompt.classList.toggle("none", !t.description);

  const tab = currentTab(t);
  P.tabAgent.disabled = !canShowAgent(t);
  P.tabTask.classList.toggle("active", tab === "task");
  P.tabAgent.classList.toggle("active", tab === "agent");
  P.tabLoop.hidden = !canShowLoop(t);
  P.tabLoop.classList.toggle("active", tab === "loop");
  P.loopDot.hidden = !t.control?.gate?.open;
  const tone = agentTone(t);
  P.agentDot.hidden = !tone;
  if (tone) { P.agentDot.style.color = tone; P.agentDot.classList.toggle("pulse", tone === "var(--accent)" || tone === "var(--warning)"); }
  P.taskPane.hidden = tab !== "task";
  P.agentPane.hidden = tab !== "agent";
  P.loopPane.hidden = tab !== "loop";
  updateLoop(t);
  updateAgent(t);
  updateComposer(t, tab);
  if (tab === "agent") startPeek(); else stopPeek();
}

function updateLoop(t) {
  P.loopOpen.disabled = !sessionConnected(t);
  if (!canShowLoop(t) || !window.ControlView) return;
  const shape = t.control?.loop ?? loopSummary(t) ?? { id: t.loop, name: t.loop, description: "", maxPasses: 0, plan: "none", planReviewer: null, stages: [] };
  const key = JSON.stringify([shape, t.control]);
  if (P.loopKey === key) return;
  P.loopKey = key;
  ControlView.renderLoop(P.loopView, shape, t.control, {
    onDecide: (decisions, pause) => act("POST", tpath(t.id, "/control/decide"), { decisions, pause }).catch(() => {}),
  });
}

function updateAgent(t) {
  const spawning = t.spawn.state === "running", spawnFailed = t.spawn.state === "failed";
  P.spawn.el.hidden = !(spawning || spawnFailed);
  if (spawning || spawnFailed) {
    P.spawn.el.classList.toggle("failed", spawnFailed);
    P.spawn.ic.replaceChildren(spawning ? frag(spinner(13)) : I("alert", 14));
    P.spawn.lbl.textContent = spawning ? "Creating the worktree and starting omp" : "Couldn't start the task";
    P.spawn.err.hidden = !spawnFailed;
    P.spawn.err.textContent = t.spawn.error || "";
    const pinned = P.spawn.log.scrollHeight - P.spawn.log.scrollTop - P.spawn.log.clientHeight < 8;
    if (P.spawn.log.textContent !== (t.spawn.log || "")) { P.spawn.log.textContent = t.spawn.log || ""; if (pinned) P.spawn.log.scrollTop = P.spawn.log.scrollHeight; }
    P.spawn.log.hidden = !t.spawn.log;
  }
  P.live.hidden = !t.worktree;
  P.removed.hidden = !!t.worktree || spawning || spawnFailed;
  if (!t.worktree) return;
  P.agentHead.replaceChildren(stateEl(t.agent ? statusOf({ ...t, spawn: { state: "done" } }) : { tone: "faint", dot: true, text: "No agent" }), h("span", { class: "spacer" }));
  if (t.pr) P.agentHead.append(prChip(t.pr));
  const step = t.agent && (AGENT_LABEL[t.agent.state] || t.agent.state === "needs_input") ? t.agent.step : null;
  P.agentStep.hidden = !step;
  P.agentStep.lastChild.textContent = step || "";
  P.agentStep.title = step || "";
  P.agentMsg.hidden = !(t.agent && t.agent.message);
  P.agentMsg.lastChild.textContent = t.agent && t.agent.message ? t.agent.message : "";
  P.gitRow.replaceChildren(h("span", { class: "branch", title: t.branch }, I("branch", 12), h("span", {}, t.branch)), I("arrowRight", 11, "to"), h("span", { class: "branch" }, h("span", {}, t.base)));
  if (t.git && (t.git.added || t.git.removed)) P.gitRow.append(diffstat(t.git));
  if (t.git && t.git.dirty > 0) P.gitRow.append(h("span", {}, plural(t.git.dirty, "uncommitted file")));
  const readable = t.execution?.kind === "tmux" || sessionConnected(t);
  P.term.hidden = !readable;
  const missing = !!t.health?.worktreeMissing;
  P.closed.hidden = missing || sessionConnected(t) || t.agent?.state === "stopped";
  P.agentPane.querySelector("[data-presentation-diff]").hidden = !t.presentation?.capabilities?.diff;
  P.cleanup.hidden = t.column !== "done" || missing;
  P.health.hidden = !missing;
  const failed = t.lastOperation && !t.lastOperation.ok && !t.intent ? t.lastOperation : null;
  P.opFail.hidden = !failed;
  if (failed) P.opFailText.replaceChildren(h("strong", {}, `${OP_LABEL[failed.op] || failed.op} failed ${ago(failed.at)}:`), " " + (failed.error || ""));
  P.actions.hidden = missing;
  P.cleanupText.replaceChildren(t.intent?.op === "remove"
    ? h("span", {}, h("strong", {}, "Removing the worktree"), t.intent.attempt > 0 ? ` · retrying: ${t.intent.lastError || ""}` : " once its agent has exited.")
    : t.merged
    ? h("span", {}, h("strong", {}, "Merged into " + t.base), ` ${ago(t.merged.at)} (${t.merged.sha.slice(0, 7)}). The worktree can go.`)
    : t.pr && t.pr.state === "merged"
      ? h("span", {}, h("strong", {}, `#${t.pr.number} merged`), ` into ${t.base}. The worktree can go.`)
      : h("span", {}, h("strong", {}, "Done."), " Remove the worktree when you no longer need it."));
}

// MARK: composer
function updateComposer(t, tab) {
  const mode = tab === "agent" && t.worktree ? "agent" : null;
  P.composer.hidden = !mode;
  if (P.cmode !== mode) {
    if (P.cmode) drafts.set(`${t.id}:${P.cmode}`, P.ta.value);
    P.cmode = mode;
    P.ta.value = mode ? drafts.get(`${t.id}:${mode}`) || "" : "";
    autosize(P.ta, 220);
  }
  if (!mode) return;
  const connected = sessionConnected(t);
  const state = t.agent && t.agent.state;
  const available = connected && !t.paused && !!state && !["stopped", "disconnected", "plan_ready", "needs_input"].includes(state);
  P.ta.disabled = !available;
  P.ta.placeholder = !connected ? "The omp session is disconnected"
    : t.paused ? "Paused: move it to In Progress to message the agent"
    : state === "plan_ready" ? "Its plan waits for review"
    : state === "needs_input" ? "It waits for your answer; connect to its terminal"
    : available ? "Message the agent…" : "No connected omp session";
  syncSend();
}
function syncSend() {
  if (!P || !P.cmode) return;
  P.send.disabled = P.sending || P.ta.disabled || !P.ta.value.trim();
  P.hint.textContent = P.ta.disabled ? "" : "\u2318\u21A9 to send";
}
async function submitComposer() {
  const t = findTask(openId);
  if (!t || !P || !P.cmode || P.sending) return;
  const text = P.ta.value.trim();
  const mode = P.cmode;
  if (!text || P.ta.disabled) return;
  P.sending = true;
  syncSend();
  try {
    await act("POST", tpath(t.id, "/message"), { text }, "Sent to the agent");
    drafts.delete(`${t.id}:${mode}`);
    if (P && openId === t.id && P.cmode === mode) { P.ta.value = ""; autosize(P.ta, 220); }
  } catch {}
  if (P) { P.sending = false; syncSend(); }
}

// MARK: terminal peek
function peekWanted() {
  const t = openId && findTask(openId);
  return !!(P && t && t.worktree && (t.execution?.kind === "tmux" || sessionConnected(t)) && currentTab(t) === "agent" && document.visibilityState === "visible");
}
function startPeek() {
  if (!peekWanted()) { stopPeek(); return; }
  if (peekTimer) return;
  const tick = async () => {
    if (!peekWanted()) { stopPeek(); return; }
    const id = openId;
    try {
      const view = wbScreen(await api("GET", tpath(id, "/screen")), Infinity);
      if (P && openId === id && P.termKey !== view.key) {
        P.termKey = view.key;
        wbPaint(P.term, view);
        if (P.termPinned) P.term.scrollTop = P.term.scrollHeight;
      }
    } catch {}
  };
  tick();
  peekTimer = setInterval(tick, 2000);
}
function stopPeek() { clearInterval(peekTimer); peekTimer = null; }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") startPeek(); else stopPeek(); });

// MARK: resizer
(() => {
  const saved = parseInt(LS.get("panelWidth"), 10);
  if (saved) document.documentElement.style.setProperty("--panel-w", `${saved}px`);
  const r = $("#resizer");
  r.addEventListener("pointerdown", e => {
    e.preventDefault();
    r.setPointerCapture(e.pointerId);
    r.classList.add("dragging");
    let width = 0;
    const move = ev => {
      width = Math.round(Math.min(Math.max(innerWidth - ev.clientX, 200), innerWidth * (innerWidth <= 900 ? 0.6 : 0.72)));
      document.documentElement.style.setProperty("--panel-w", `${width}px`);
    };
    const up = () => {
      r.classList.remove("dragging");
      r.removeEventListener("pointermove", move);
      r.removeEventListener("pointerup", up);
      if (width) LS.set("panelWidth", String(width));
    };
    r.addEventListener("pointermove", move);
    r.addEventListener("pointerup", up);
  });
})();

</script>

<script>
"use strict";
// MARK: wiring
$("#brand").append(I("rocket", 18), "Mission Control");
$("#search").prepend(I("search", 13));
$("#refreshBtn").append(I("refresh", 14));
$("#refreshBtn").onclick = () => act("POST", "/api/refresh", {}, "Refreshing agents, git and pull requests").catch(() => {});
$("#newBtn").append(I("plus", 14), "New task", h("kbd", {}, "N"));
$("#newBtn").onclick = () => openComposer();
// Double-clicking empty space starts a task; the Graph handles its own canvas, which places the new node where you clicked.
$("#board").addEventListener("dblclick", e => {
  if (boardView !== "pipeline" && e.target.matches(".board,.col-b,.col-empty,.workbench,.wb-grid,.wb-empty")) openComposer();
});
if (LS.get("boardView") === "live") boardView = "live";
for (const [view, id, glyph] of [["board", "boardViewBtn", "kanban"], ["pipeline", "pipelineViewBtn", "branch"], ["live", "liveViewBtn", "activity"]]) {
  const button = $("#" + id);
  button.append(I(glyph, 14));
  button.setAttribute("aria-pressed", String(boardView === view));
  button.onclick = () => {
    if (boardView === view) return;
    if (boardView === "live") stopWorkbench();
    boardView = view;
    LS.set("boardView", view);
    for (const b of document.querySelectorAll(".view-switch button")) b.setAttribute("aria-pressed", String(b === button));
    renderBoard();
  };
}
window.addEventListener("pagehide", () => stopWorkbench());
$("#filter").addEventListener("input", e => { filter = e.target.value.trim().toLowerCase(); renderBoard(); });
$("#filter").addEventListener("keydown", e => { if (e.key === "Escape" && e.target.value) { e.preventDefault(); e.stopPropagation(); e.target.value = ""; filter = ""; renderBoard(); } });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if (menu) closeMenu();
    else if (modals.length) closeModal();
    else if (isTyping()) document.activeElement.blur();
    else if (openId) closePanel();
    else return;
    e.preventDefault();
    return;
  }
  if (isTyping() || modals.length || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "n" || e.key === "N") { e.preventDefault(); openComposer(); }
  else if (e.key === "/") { e.preventDefault(); $("#filter").focus(); }
});
window.addEventListener("hashchange", () => {
  const id = taskRef(decodeURIComponent(location.hash.slice(1)));
  if (id && findTask(id)) openPanel(id);
  else if (!id && openId) closePanel();
});
setInterval(() => {
  document.querySelectorAll("[data-elapsed]").forEach(el => { if (el.dataset.elapsed) el.textContent = elapsed(el.dataset.elapsed); });
}, 1000);

(async () => {
  await loadState();
  const id = taskRef(decodeURIComponent(location.hash.slice(1)));
  if (id && findTask(id)) openPanel(id);
  connect();
})();
</script>
