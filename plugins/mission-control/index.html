<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission Control</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f7bf6'/%3E%3Cg transform='translate(5 5) scale(.9167)' fill='none' stroke='%23fff' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5'/%3E%3Cpath d='M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09'/%3E%3Cpath d='M9 12a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.4 22.4 0 0 1-4 2z'/%3E%3Cpath d='M9 12H4s.55-3.03 2-4c1.62-1.08 5 .05 5 .05'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="/design-system.css">
<style>
:root{--header-h:40px;--panel-w:460px}
body{display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
@keyframes pulse{50%{opacity:.3}}
@keyframes pop{from{opacity:0;transform:translateY(4px) scale(.98)}}
@keyframes fade{from{opacity:0}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* MARK: controls */
.chip{display:inline-flex;align-items:center;gap:4px;min-width:0;height:18px;padding:0 6px;border-radius:var(--radius-sm);background:var(--surface-2);color:var(--muted);font-size:var(--font-size-xs);font-weight:500;white-space:nowrap}
.dot{flex:none;width:7px;height:7px;border-radius:50%;background:currentColor}
.dot.pulse{animation:pulse 1.4s ease-in-out infinite}
.shake{animation:shake .3s}

/* MARK: toolbar */
.toolbar{display:flex;flex:none;align-items:center;gap:8px;height:var(--header-h);padding:0 10px 0 14px}
.brand{display:inline-flex;align-items:center;gap:7px;font-size:var(--font-size);font-weight:650}
.brand .icon{color:var(--accent)}
.ctx{display:inline-flex;align-items:center;gap:5px;min-width:0;margin-left:4px;padding-left:12px;color:var(--muted);white-space:nowrap}
.ctx strong{color:var(--fg);font-weight:600}
.ctx .mono{overflow:hidden;font-size:var(--font-size-sm);text-overflow:ellipsis}
button.ctx{border:0;background:none;padding:0 0 0 12px}
button.ctx:hover{color:var(--fg)}
.conn{flex:none;width:7px;height:7px;margin-left:2px;border-radius:50%;background:var(--remove)}
.conn.on{background:var(--add)}
.search{display:flex;align-items:center;gap:6px;width:220px;height:var(--control-h);padding:0 5px 0 8px;border:1px solid transparent;border-radius:var(--radius);background:var(--surface);color:var(--faint)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search input{flex:1;min-width:0;height:100%;padding:0;border:0;background:transparent;color:var(--fg)}
.search:focus-within kbd{display:none}
.tagbar{display:flex;flex:none;flex-wrap:wrap;align-items:center;gap:6px;padding:0 14px 4px;color:var(--faint)}
.tagbar[hidden]{display:none}
.tag{display:inline-flex;flex:none;align-items:center;gap:3px;height:18px;padding:0 7px;border:0;border-radius:9px;background:var(--accent-soft);color:var(--accent);font-size:var(--font-size-xs);font-weight:500;white-space:nowrap}
.tagbar button.tag{height:22px;padding:0 9px;background:var(--surface);color:var(--muted)}
.tagbar button.tag:hover{color:var(--fg)}
.tagbar button.tag.on{background:var(--accent);color:var(--accent-fg)}
.c-tags{display:flex;flex-wrap:wrap;align-items:center;gap:4px;min-width:0}
.c-tags>.chip{max-width:100%;overflow:hidden}

/* MARK: board */
.main{position:relative;display:flex;flex:1;min-height:0}
.board{display:flex;flex:1;gap:10px;min-width:0;padding:12px;overflow-x:auto;overflow-y:hidden}
.col{display:flex;flex:1 1 210px;flex-direction:column;min-width:188px;max-width:400px;min-height:0;border-radius:var(--radius-lg);background:var(--surface)}
.col[data-col=idle]{opacity:.6}
.col-h{display:flex;flex:none;align-items:center;gap:7px;height:38px;padding:0 6px 0 12px}
.col-t{font-weight:600}
.col-h .count{color:var(--faint);font-weight:500;font-variant-numeric:tabular-nums}
.col-b{display:flex;flex:1;flex-direction:column;gap:8px;min-height:60px;padding:0 8px 12px;overflow-y:auto}
.col-empty{padding:18px 10px;border-radius:8px;color:var(--faint);font-size:var(--font-size-sm);text-align:center}
.card{position:relative;display:flex;flex:none;flex-direction:column;gap:6px;min-width:0;padding:9px 11px 10px;border:1px solid transparent;border-radius:8px;background:var(--raised);cursor:pointer}
.card:hover{background:var(--hover)}
.card:focus-visible,.pipeline-node:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card.is-hidden,.pipeline-node.is-hidden{opacity:.55}
.card.sel{border-color:var(--accent);background:var(--accent-soft)}
.card.path-ready:not(.sel),.pipeline-node.path-ready:not(.sel){background:color-mix(in srgb,var(--add) 12%,var(--raised))}
.card.path-blocked:not(.sel),.pipeline-node.path-blocked:not(.sel){background:color-mix(in srgb,var(--remove) 10%,var(--raised))}
.card.path-unrelated:not(:hover),.pipeline-node.path-unrelated:not(:hover){opacity:.4}
.folder{flex:none;color:var(--faint);font-family:var(--mono);font-weight:400}
.folder::after{content:"/"}
.card.needs{background:color-mix(in srgb,var(--warning) 5%,var(--raised))}
.card.needs::before{content:"";position:absolute;top:9px;bottom:9px;left:-1px;width:3px;border-radius:0 3px 3px 0;background:var(--warning)}
.c-top{display:flex;align-items:center;gap:6px;min-width:0;color:var(--faint);font-size:var(--font-size-sm)}
.c-top:empty{display:none}
.c-title{display:-webkit-box;overflow:hidden;font-family:var(--mono);font-size:var(--font-size-sm);font-weight:500;line-height:1.35;overflow-wrap:anywhere;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.c-title .folder{font-size:var(--font-size-xs)}
.c-line{display:flex;align-items:center;gap:6px;min-width:0;color:var(--muted);font-size:var(--font-size-sm)}
.c-line>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-line>.icon{flex:none;color:var(--faint)}
.c-git{display:flex;align-items:center;gap:8px;min-width:0;color:var(--muted);font-size:var(--font-size-sm)}
.c-deps .mono{color:var(--fg);font-size:var(--font-size-xs)}
.c-deps .chip{height:16px;vertical-align:1px}
.c-deps .ok{display:inline-block;color:var(--add);vertical-align:-1px}
.c-git .commit{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-actions{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-top:3px}
.c-actions .more{margin-left:auto;padding:0 6px}
.c-actions a.btn{text-decoration:none}
.state{display:inline-flex;align-items:center;gap:6px;font-size:var(--font-size-sm);font-weight:550;white-space:nowrap}
.state .t{color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.state.busy{color:var(--accent)}
.state.needs{color:var(--warning)}
.state.idle{color:var(--muted)}
.state.idle .dot{color:var(--add)}
.state.faint{color:var(--faint)}
.diffstat{font-family:var(--mono);font-size:var(--font-size-xs);font-variant-numeric:tabular-nums;white-space:nowrap}
.diffstat .a{color:var(--add)}
.diffstat .r{color:var(--remove)}
.udot{flex:none;width:6px;height:6px;border-radius:50%;background:var(--warning)}
.pr-chip{display:inline-flex;flex:none;align-items:center;gap:3px;height:18px;padding:0 5px;border-radius:var(--radius-sm);background:color-mix(in srgb,currentColor 14%,transparent);font-size:var(--font-size-xs);font-weight:600;text-decoration:none!important}
.pr-checks{flex:none;width:6px;height:6px;margin-left:1px;border-radius:50%}
.pr-checks.passing{background:var(--add)}
.pr-checks.failing{background:var(--remove)}
.pr-checks.pending{display:inline-flex;width:auto;height:auto;background:none;color:var(--faint)}
.pr-chip .approved{color:var(--add)}
.pr-chip .changes,.pr-chip .conflict{color:var(--remove)}

/* MARK: menu */
.menu{position:fixed;z-index:90;min-width:210px;max-width:380px;max-height:calc(100vh - 16px);padding:4px;overflow-y:auto;border-radius:9px;background:var(--raised);box-shadow:var(--shadow);animation:pop .1s ease-out}
.menu-h{padding:6px 9px 4px;overflow:hidden;color:var(--faint);font-size:var(--font-size-xs);font-weight:600;letter-spacing:.05em;text-overflow:ellipsis;text-transform:uppercase;white-space:nowrap}
.menu-note{padding:4px 9px 7px;color:var(--muted);font-size:var(--font-size-sm)}
.menu button{display:flex;align-items:center;gap:9px;width:100%;height:var(--field-h);padding:0 9px;border:0;border-radius:var(--radius);background:transparent;text-align:left;white-space:nowrap}
.menu button .icon{color:var(--muted)}
.menu button .lbl{flex:1;overflow:hidden;text-overflow:ellipsis}
.menu button .sub{color:var(--faint);font-size:var(--font-size-sm)}
.menu button .chk{color:var(--accent)}
.menu button:hover,.menu button:focus-visible{outline:none;background:var(--accent);color:var(--accent-fg)}
.menu button:hover .icon,.menu button:hover .sub,.menu button:focus-visible .icon,.menu button:focus-visible .sub{color:inherit}
.menu button.danger,.menu button.danger .icon{color:var(--remove)}
.menu button.danger:hover,.menu button.danger:hover .icon{background:var(--remove);color:#fff}
.menu hr{margin:4px 2px;border:0;border-top:1px solid var(--line)}
.menu-input{width:calc(100% - 8px);margin:4px}
.tag .x{display:inline-flex;margin-right:-3px;color:var(--faint);cursor:pointer}
.tag .x:hover{color:var(--remove)}
.tag.rule{background:var(--surface-2);color:var(--muted)}
.tags-edit{display:flex;flex-wrap:wrap;align-items:center;gap:4px;min-height:var(--control-h)}

/* MARK: panel */
.resizer{flex:none;width:7px;margin:0 -3px 0 -4px;z-index:5;cursor:col-resize}
.resizer:hover,.resizer.dragging{background:var(--accent-soft)}
.panel{display:flex;flex:none;flex-direction:column;width:var(--panel-w);min-width:380px;max-width:72vw;min-height:0;background:var(--surface)}
.p-head{display:flex;flex:none;align-items:center;gap:8px;height:var(--header-h);padding:0 8px 0 16px}
.p-head .state{min-width:0;overflow:hidden}
.p-scroll{display:flex;flex:1;flex-direction:column;gap:18px;min-height:0;padding:6px 16px 20px;overflow-y:auto}
.p-title{margin:0;font-family:var(--mono);font-size:var(--font-size-lg);font-weight:650;line-height:1.35;overflow-wrap:anywhere}
.p-sub{display:flex;flex-direction:column;gap:2px;margin-top:4px;color:var(--muted);font-family:var(--mono);font-size:var(--font-size-xs);overflow-wrap:anywhere}
.sec{display:flex;flex-direction:column;gap:8px}
.sec-h{display:flex;align-items:center;gap:6px;height:24px;color:var(--muted);font-size:var(--font-size-sm);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.sec-h .meta{color:var(--faint);font-weight:400;letter-spacing:0;text-transform:none}
.sec-h .tool-button{margin-left:auto}
.p-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;min-width:0;color:var(--muted);font-size:var(--font-size-sm)}
.p-row .mono{color:var(--fg)}
.p-none{color:var(--faint);font-size:var(--font-size-sm)}
.p-commit{flex-wrap:nowrap}
.p-commit>.mono{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-commit>span:last-child{flex:none}
.dep{display:flex;align-items:center;gap:7px;min-width:0;padding:4px 4px 4px 8px;border-radius:7px;background:var(--raised);font-size:var(--font-size-sm)}
.dep .t{flex:1;min-width:0;overflow:hidden;font-family:var(--mono);text-overflow:ellipsis;white-space:nowrap}
.dep .tool-button{width:22px;height:22px}
.panel .wb-agent{background:var(--raised)}

/* MARK: composer */
.modal.nt{width:620px}
.nt-head{display:flex;align-items:center;gap:6px;padding:14px 18px 0;color:var(--muted);font-size:var(--font-size-sm);font-weight:500}
.nt-head>.icon{color:var(--accent)}
.nt-desc{display:block;width:100%;min-height:110px;max-height:45vh;padding:8px 18px 12px;border:0;background:transparent;font-size:var(--font-size);line-height:1.55;resize:none}
.nt-props{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 14px}
.prop-chip{display:inline-flex;align-items:center;gap:6px;height:var(--tool-size);padding:0 9px;border:1px solid transparent;border-radius:7px;background:var(--surface);color:var(--muted)}
.prop-chip:focus-within{border-color:var(--accent)}
.prop-chip input{width:240px;padding:0;border:0;background:transparent;color:var(--fg);font-family:var(--mono);font-size:var(--font-size-sm)}
.prop-chip select{max-width:240px;padding:0;border:0;background:transparent;color:var(--fg);font-family:var(--mono);font-size:var(--font-size-sm)}
.nt-foot{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 14px;background:var(--surface)}
.hint{color:var(--faint);font-size:var(--font-size-sm);white-space:nowrap}

/* MARK: modals */
.overlay{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px 16px;background:rgb(0 0 0 / .45);animation:fade .12s ease-out}
.modal{display:flex;flex-direction:column;width:440px;max-width:100%;max-height:100%;overflow:hidden;border-radius:12px;background:var(--raised);box-shadow:var(--shadow);animation:pop .14s ease-out}
.m-body{display:flex;flex-direction:column;gap:10px;padding:18px 18px 16px}
.m-body h2{margin:0;font-size:var(--font-size-lg);font-weight:650}
.m-text{margin:0;color:var(--muted);line-height:1.5}
.m-label{margin-bottom:-4px;color:var(--muted);font-size:var(--font-size-sm);font-weight:500}
.m-note{display:flex;flex-wrap:wrap;align-items:center;gap:5px;color:var(--muted);font-size:var(--font-size-sm)}
.m-foot{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--surface)}
.toasts{position:fixed;bottom:18px;left:50%;z-index:100;display:flex;flex-direction:column;align-items:center;gap:6px;transform:translateX(-50%);pointer-events:none}
.toast{display:flex;align-items:flex-start;gap:8px;max-width:560px;padding:8px 14px;border-radius:9px;background:var(--raised);box-shadow:var(--shadow);animation:pop .14s ease-out;pointer-events:auto}
.toast>span{display:-webkit-box;overflow:hidden;white-space:pre-line;overflow-wrap:anywhere;-webkit-line-clamp:8;-webkit-box-orient:vertical}
.toast .icon{flex:none;margin-top:2px;color:var(--add)}
.toast.error .icon{color:var(--remove)}
@media (max-width:900px){.search{width:150px}.panel{min-width:0;width:min(var(--panel-w),60vw)}}
</style>

<link rel="stylesheet" href="/workbench.css">

</head>
<body>
<header class="toolbar">
  <div class="segmented icons view-switch" role="group" aria-label="View">
    <button id="boardViewBtn" title="Board view" aria-label="Board view"></button>
    <button id="pipelineViewBtn" title="Graph view: which branch each worktree comes from" aria-label="Graph view"></button>
    <button id="liveViewBtn" title="Live view: what every omp is doing and what waits for you" aria-label="Live view"></button>
  </div>
  <span class="brand" id="brand"></span>
  <button class="ctx" id="ctx"></button>
  <span class="conn" id="conn" title="Disconnected"></span>
  <span class="spacer"></span>
  <label class="search" id="search"><input id="filter" placeholder="Filter worktrees" spellcheck="false" autocomplete="off"><kbd>/</kbd></label>
  <button class="tool-button" id="refreshBtn" title="Refresh omp sessions, git and pull requests"></button>
  <button class="btn primary" id="newBtn"></button>
</header>
<nav class="tagbar" id="tagbar" aria-label="Filter by tag" hidden></nav>
<div class="main">
  <div class="board" id="board"></div>
  <div class="resizer" id="resizer" hidden></div>
  <aside class="panel" id="panel" hidden></aside>
</div>
<div class="toasts" id="toasts"></div>

  const m = el.getBoundingClientRect();

// MARK: new worktree
function openNewWorktree({ after = "", onCreated = null, onClosed = null } = {}) {
  if (modals.length || !board) return;
  const project = selectedProject();
  if (!project) { toast("This project is unavailable: run /mission in its checkout", true); return; }
  const prompt = h("textarea", { class: "nt-desc", rows: "5", "aria-label": "Prompt",
    placeholder: "What should change, and why? Optional: its omp plans this first and you review the plan in its terminal." });
  const branch = h("input", { type: "text", placeholder: "feature/my-change", spellcheck: "false", autocomplete: "off", "aria-label": "Branch" });
  prompt.addEventListener("input", () => { branch.placeholder = prompt.value.trim() ? "feature/… from the prompt" : "feature/my-change"; });
  const choices = projectWorktrees().filter(w => w.branch);
  const afterSel = h("select", { "aria-label": "After" }, h("option", { value: "" }, `None · from ${project.defaultBranch}`), ...choices.map(w => h("option", { value: w.key }, w.key)));
  afterSel.value = after;
  const create = h("button", { class: "btn primary" }, "Create worktree", h("kbd", {}, "\u2318\u21A9"));
  const submit = async () => {
    const text = prompt.value.trim(), name = branch.value.trim();
    if (!text && !name) { branch.focus(); branch.parentNode.classList.remove("shake"); void branch.offsetWidth; branch.parentNode.classList.add("shake"); return; }
    create.disabled = true;
    create.replaceChildren(frag(spinner(12)), "Creating…");
    try {
      const r = await api("POST", "/api/worktrees/new", { project: project.id, ...(name ? { branch: name } : {}), ...(text ? { prompt: text } : {}), ...(afterSel.value ? { after: afterSel.value } : {}) });
      closeModal(ov);
      toast(r.output || `Created ${r.path}`);
      onCreated?.(r.key);
      if (text && !r.opened && r.command) commandModal(`Start ${r.key}`, "No terminal could be opened there. Run this in a terminal to start its omp in plan mode on the prompt.", r.command);
      loadState();
    } catch (e) {
      failed(e);
      create.disabled = false;
      create.replaceChildren("Create worktree", h("kbd", {}, "\u2318\u21A9"));
    }
  };
  create.onclick = submit;
  branch.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); submit(); } });
  const ov = openModal([
    h("div", { class: "nt-head" }, I("plus", 13), "New worktree", h("span", { class: "spacer" }), project.name),
    prompt,
    h("div", { class: "nt-props" },
      h("label", { class: "prop-chip", title: "Optional with a prompt: named from it" }, I("branch", 13), branch),
      h("label", { class: "prop-chip", title: "Branches from that checkout's branch, nests under it and depends on it" }, I("link", 13), "After", afterSel)),
    h("div", { class: "nt-foot" }, h("span", { class: "hint" }, "With a prompt its omp starts in plan mode there"), h("span", { class: "spacer" }),
      h("button", { class: "btn ghost", onclick: () => closeModal(ov) }, "Cancel"), create)], "nt");
  ov.addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); submit(); } });
  ov.onclose = onClosed;
  setTimeout(() => prompt.focus(), 0);
  return true;
}
</script>
<script src="/pipeline.js"></script>
<script src="/workbench.js"></script>
<script>
"use strict";
// MARK: wiring
$("#brand").append(I("rocket", 18), "Mission Control");
$("#search").prepend(I("search", 13));
$("#refreshBtn").append(I("refresh", 14));
$("#refreshBtn").onclick = () => act("POST", "/api/refresh", {}, "Refreshing omp sessions, git and pull requests").catch(() => {});
$("#newBtn").append(I("plus", 14), "New worktree", h("kbd", {}, "N"));
$("#newBtn").onclick = () => openNewWorktree();
$("#board").addEventListener("dblclick", e => {
  if (boardView !== "pipeline" && e.target.matches(".board,.col-b,.col-empty,.workbench,.wb-grid,.wb-empty,.wb-quiet,.wb-rows")) openNewWorktree();
});
for (const [view, id, glyph] of [["board", "boardViewBtn", "kanban"], ["pipeline", "pipelineViewBtn", "branch"], ["live", "liveViewBtn", "activity"]]) {
  const button = $("#" + id);
  button.append(I(glyph, 14));
  button.setAttribute("aria-pressed", String(boardView === view));
  button.onclick = () => {
    if (boardView === view) return;
    boardView = view;
    LS.set("boardView", view);
    for (const b of document.querySelectorAll(".view-switch button")) b.setAttribute("aria-pressed", String(b === button));
    renderBoard();
  };
}
$("#filter").addEventListener("input", e => { filter = e.target.value.trim().toLowerCase(); renderBoard(); });
$("#filter").addEventListener("keydown", e => { if (e.key === "Escape" && e.target.value) { e.preventDefault(); e.stopPropagation(); e.target.value = ""; filter = ""; renderBoard(); } });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if (menu) closeMenu();
    else if (modals.length) closeModal();
    else if (isTyping()) document.activeElement.blur();
    else if (openKey) closePanel();
    else return;
    e.preventDefault();
    return;
  }
  if (isTyping() || modals.length || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "n" || e.key === "N") { e.preventDefault(); openNewWorktree(); }
  else if (e.key === "/") { e.preventDefault(); $("#filter").focus(); }
});
// MARK: resizer
(() => {
  const saved = parseInt(LS.get("panelWidth"), 10);
  if (saved) document.documentElement.style.setProperty("--panel-w", `${saved}px`);
  const r = $("#resizer");
  r.addEventListener("pointerdown", e => {
    e.preventDefault();
    r.setPointerCapture(e.pointerId);
    r.classList.add("dragging");
    let width = 0;
    const move = ev => {
      width = Math.round(Math.min(Math.max(innerWidth - ev.clientX, 200), innerWidth * (innerWidth <= 900 ? 0.6 : 0.72)));
      document.documentElement.style.setProperty("--panel-w", `${width}px`);
    };
    const up = () => {
      r.classList.remove("dragging");
      r.removeEventListener("pointermove", move);
      r.removeEventListener("pointerup", up);
      if (width) LS.set("panelWidth", String(width));
    };
    r.addEventListener("pointermove", move);
    r.addEventListener("pointerup", up);
  });
})();
setInterval(() => {
  document.querySelectorAll("[data-elapsed]").forEach(el => { if (el.dataset.elapsed) el.textContent = elapsed(el.dataset.elapsed); });
}, 1000);

(async () => {
  await loadState();
  connect();
})();
</script>
</body>
</html>
